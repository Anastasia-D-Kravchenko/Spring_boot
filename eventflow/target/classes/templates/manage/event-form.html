<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Event Form')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Event Manager</div>
      <nav class="sidebar-nav">
        <a th:href="@{/manage/dashboard}" class="sidebar-link"><span class="sidebar-icon">📊</span> Dashboard</a>
        <a th:href="@{/manage/events}" class="sidebar-link"><span class="sidebar-icon">🗓️</span> My Events</a>
        <a th:href="@{/manage/events/new}" class="sidebar-link active"><span class="sidebar-icon">➕</span> New Event</a>
        <a th:href="@{/manage/ai}" class="sidebar-link" style="color:var(--accent2)"><span class="sidebar-icon">✨</span> AI Assistant</a>
      </nav>
    </div>
  </aside>

  <main class="main-content">
    <div class="breadcrumb mb-24">
      <a th:href="@{/manage/dashboard}">Dashboard</a>
      <span class="breadcrumb-sep">/</span>
      <a th:href="@{/manage/events}">Events</a>
      <span class="breadcrumb-sep">/</span>
      <span th:text="${event != null ? 'Edit: ' + event.title : 'New Event'}">Form</span>
    </div>

    <h1 class="mb-24" th:text="${event != null ? 'Edit Event' : 'Create New Event'}">Event Form</h1>

    <div class="card" style="max-width:760px">
      <div class="card-body">
        <form th:action="${event != null ? '/manage/events/' + event.id + '/edit' : '/manage/events/new'}"
              method="post" th:object="${dto}">

          <!-- Title -->
          <div class="form-group">
            <label class="form-label">Event Title *</label>
            <input type="text" class="form-control" th:field="*{title}"
                   th:classappend="${#fields.hasErrors('title')} ? 'field-error' : ''"
                   placeholder="e.g. Spring Boot Workshop 2024"/>
            <div class="form-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
          </div>

          <!-- Description -->
          <div class="form-group">
            <label class="form-label">Description *</label>
            <textarea class="form-control" th:field="*{description}" rows="5"
                      th:classappend="${#fields.hasErrors('description')} ? 'field-error' : ''"
                      placeholder="Describe your event in detail…"></textarea>
            <div class="form-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
          </div>

          <!-- Date & Time -->
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Event Date *</label>
              <input type="date" class="form-control" th:field="*{eventDate}"
                     th:classappend="${#fields.hasErrors('eventDate')} ? 'field-error' : ''"/>
              <div class="form-error" th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}"></div>
            </div>
            <div class="form-group">
              <label class="form-label">Event Time *</label>
              <input type="time" class="form-control" th:field="*{eventTime}"
                     th:classappend="${#fields.hasErrors('eventTime')} ? 'field-error' : ''"/>
              <div class="form-error" th:if="${#fields.hasErrors('eventTime')}" th:errors="*{eventTime}"></div>
            </div>
          </div>

          <!-- Location -->
          <div class="form-group">
            <label class="form-label">Location *</label>
            <input type="text" class="form-control" th:field="*{location}"
                   th:classappend="${#fields.hasErrors('location')} ? 'field-error' : ''"
                   placeholder="e.g. TechHub Warsaw, ul. Nowy Świat 4"/>
            <div class="form-error" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
          </div>

          <!-- Category & Capacity -->
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Category *</label>
              <select class="form-control" th:field="*{category}">
                <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.emoji + ' ' + cat.displayName}">Cat</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Max Participants *</label>
              <input type="number" class="form-control" th:field="*{maxParticipants}" min="1" max="100000"
                     th:classappend="${#fields.hasErrors('maxParticipants')} ? 'field-error' : ''"
                     placeholder="50"/>
              <div class="form-error" th:if="${#fields.hasErrors('maxParticipants')}" th:errors="*{maxParticipants}"></div>
            </div>
          </div>

          <!-- Price & Image -->
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Ticket Price (€)</label>
              <input type="number" step="0.01" min="0" class="form-control" th:field="*{price}" placeholder="0.00"/>
              <div class="form-hint">Leave 0 for free events</div>
            </div>
            <div class="form-group">
              <label class="form-label">Image URL</label>
              <input type="url" class="form-control" th:field="*{imageUrl}"
                     placeholder="https://example.com/image.jpg"/>
            </div>
          </div>

          <!-- Additional info -->
          <div class="form-group">
            <label class="form-label">Additional Information</label>
            <textarea class="form-control" th:field="*{additionalInfo}" rows="3"
                      placeholder="Parking info, dress code, what to bring…"></textarea>
          </div>

          <!-- Approval -->
          <div class="form-group" style="display:flex;align-items:center;gap:10px">
            <input type="checkbox" th:field="*{requiresApproval}" id="requiresApproval"
                   style="accent-color:var(--accent);width:16px;height:16px"/>
            <label for="requiresApproval" style="margin:0;cursor:pointer">
              Require approval for registrations
            </label>
          </div>

          <hr class="divider"/>

          <div class="flex gap-12">
            <button type="submit" class="btn btn-primary"
                    th:text="${event != null ? 'Save Changes' : 'Create Event'}">Submit</button>
            <a th:href="@{/manage/events}" class="btn btn-ghost">Cancel</a>
            <a th:href="@{/manage/ai}" class="btn btn-secondary" style="margin-left:auto">
              ✨ Use AI Instead
            </a>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
</body>
</html>
