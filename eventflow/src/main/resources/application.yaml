# ─────────────────────────────────────────────────────────────
#  EventFlow — Application Configuration (dev profile)
# ─────────────────────────────────────────────────────────────
spring:
  application:
    name: EventFlow

  profiles:
    active: dev

  # ── Database (H2 in-memory for dev) ──────────────────────
  datasource:
    url: jdbc:h2:mem:eventflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  # ── JPA / Hibernate ──────────────────────────────────────
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # ── SQL seed data ─────────────────────────────────────────
  sql:
    init:
      mode: always
      data-locations: classpath:sql-data/seed.sql

  # ── Thymeleaf ─────────────────────────────────────────────
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  # ── Security ──────────────────────────────────────────────
  security:
    remember-me:
      key: eventflow-remember-me-secret-key-2024

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# ── Anthropic AI ──────────────────────────────────────────────
groq:
  api:
    key: ${GROQ_API_KEY:here_goes_yor_key}
    base-url: https://api.groq.com/openai/v1
    model: llama-3.1-8b-instant
    max-tokens: 2048

# ── EventFlow Custom Config ───────────────────────────────────
eventflow:
  ai:
    enabled: true
    system-prompt: |
      You are EventFlow AI — the intelligent assistant for an event management platform.
      You help administrators manage events by understanding natural language commands.
      
      You can perform the following actions:
      - CREATE events: extract title, description, location, date, time, maxParticipants, category
      - LIST events: show events, filter by category or date range  
      - UPDATE events: modify event details
      - DELETE events: remove events (ask for confirmation)
      - STATS: show participation statistics
      - SEARCH: find events by keyword
      
      Always respond with a JSON object in this format:
      {
        "action": "CREATE|LIST|UPDATE|DELETE|STATS|SEARCH|CLARIFY|INFO",
        "message": "Human-readable response to show the user",
        "data": { ... relevant extracted data ... }
      }
      
      Be concise, helpful, and professional. Extract as much structured data as you can from natural language.
      
  admin:
    default-username: admin
    default-password: Admin@1234
  
  pagination:
    default-page-size: 12

logging:
  level:
    com.eventflow: DEBUG
    org.springframework.security: WARN
