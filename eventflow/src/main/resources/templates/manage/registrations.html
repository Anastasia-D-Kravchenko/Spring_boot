<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Attendees')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Event Manager</div>
      <nav class="sidebar-nav">
        <a th:href="@{/manage/dashboard}" class="sidebar-link"><span class="sidebar-icon">📊</span> Dashboard</a>
        <a th:href="@{/manage/events}" class="sidebar-link active"><span class="sidebar-icon">🗓️</span> My Events</a>
        <a th:href="@{/manage/events/new}" class="sidebar-link"><span class="sidebar-icon">➕</span> New Event</a>
        <a th:href="@{/manage/ai}" class="sidebar-link" style="color:var(--accent2)"><span class="sidebar-icon">✨</span> AI Assistant</a>
      </nav>
    </div>
  </aside>

  <main class="main-content">
    <div class="breadcrumb mb-20">
      <a th:href="@{/manage/events}">My Events</a>
      <span class="breadcrumb-sep">/</span>
      <span th:text="${event.title}">Event</span>
      <span class="breadcrumb-sep">/</span>
      <span>Attendees</span>
    </div>

    <div class="flex-between mb-28 flex-wrap gap-16">
      <div>
        <h1 th:text="${event.title}">Event Title</h1>
        <p class="text-muted mt-8"
           th:text="${#temporals.format(event.eventDate,'EEEE, dd MMMM yyyy') + ' · ' + event.location}">info</p>
      </div>
      <div class="stat-card" style="text-align:center;min-width:140px">
        <div class="stat-value" th:text="${registrations.size()}">0</div>
        <div class="stat-label">Total Registrations</div>
      </div>
    </div>

    <div th:if="${#lists.isEmpty(registrations)}" class="empty-state">
      <div class="empty-icon">👥</div>
      <h3 class="empty-title">No registrations yet</h3>
      <p class="empty-text">Share your event link to get people signed up!</p>
      <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-primary">View Event Page</a>
    </div>

    <div class="card" th:unless="${#lists.isEmpty(registrations)}">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>#</th><th>Name</th><th>Email</th><th>Status</th><th>Registered</th></tr>
          </thead>
          <tbody>
            <tr th:each="reg, stat : ${registrations}">
              <td class="text-muted" th:text="${stat.count}">1</td>
              <td style="font-weight:600" th:text="${reg.user.fullName}">Name</td>
              <td class="text-muted" style="font-size:.85rem" th:text="${reg.user.email}">email</td>
              <td>
                <span class="badge"
                      th:text="${reg.status.name()}"
                      th:classappend="${reg.status.name() == 'CONFIRMED'} ? 'badge-success' :
                                       (${reg.status.name() == 'CANCELLED'} ? 'badge-danger' : 'badge-warning')">
                  status
                </span>
              </td>
              <td class="text-muted" style="font-size:.83rem"
                  th:text="${#temporals.format(reg.registeredAt,'dd MMM yyyy HH:mm')}">date</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
</body>
</html>
