<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create Account')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="flex-center" style="min-height:calc(100vh - 64px);padding:40px 24px">
  <div style="width:100%;max-width:480px">

    <div class="text-center mb-32">
      <div style="font-size:2.5rem;margin-bottom:12px">✨</div>
      <h1 style="font-size:1.8rem">Create your account</h1>
      <p class="text-muted mt-8">Join EventFlow and start discovering events</p>
    </div>

    <div th:if="${errorMessage}" class="flash flash--error mb-16" style="position:static">
      ❌ <span th:text="${errorMessage}"></span>
    </div>

    <div class="card">
      <div class="card-body">
        <form th:action="@{/auth/register}" method="post" th:object="${dto}">

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="firstName">First name</label>
              <input id="firstName" type="text" class="form-control" th:field="*{firstName}"
                     th:classappend="${#fields.hasErrors('firstName')} ? 'field-error' : ''"
                     placeholder="Jane" required/>
              <div class="form-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="lastName">Last name</label>
              <input id="lastName" type="text" class="form-control" th:field="*{lastName}"
                     th:classappend="${#fields.hasErrors('lastName')} ? 'field-error' : ''"
                     placeholder="Doe" required/>
              <div class="form-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input id="email" type="email" class="form-control" th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'field-error' : ''"
                   placeholder="jane@example.com" required/>
            <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input id="password" type="password" class="form-control" th:field="*{password}"
                   th:classappend="${#fields.hasErrors('password')} ? 'field-error' : ''"
                   placeholder="At least 8 characters" required/>
            <div class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" type="password" class="form-control" th:field="*{confirmPassword}"
                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'field-error' : ''"
                   placeholder="Repeat password" required/>
            <div class="form-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:8px">
            Create Account →
          </button>
        </form>

        <hr class="divider"/>
        <p class="text-center text-muted" style="font-size:.88rem">
          Already have an account? <a th:href="@{/auth/login}">Log in</a>
        </p>
      </div>
    </div>
  </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
