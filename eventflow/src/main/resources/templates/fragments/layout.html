<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${title} + ' — EventFlow'">EventFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>"/>
</head>

<body>

<!-- ── Navigation ── -->
<nav th:fragment="nav" class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo">
      <span class="logo-icon">⚡</span>
      <span class="logo-text">EventFlow</span>
    </a>

    <div class="nav-links">
      <a th:href="@{/events}" class="nav-link">Events</a>

      <!-- Not logged in -->
      <div sec:authorize="isAnonymous()" class="nav-auth">
        <a th:href="@{/auth/login}" class="btn btn-ghost">Log in</a>
        <a th:href="@{/auth/register}" class="btn btn-primary">Sign up</a>
      </div>

      <!-- Logged in -->
      <div sec:authorize="isAuthenticated()" class="nav-user">
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}" class="nav-link nav-link--accent">Admin</a>
        <a sec:authorize="hasAnyRole('DATA_ADDER','ADMIN')" th:href="@{/manage/dashboard}" class="nav-link">Manage</a>
        <a sec:authorize="hasAnyRole('DATA_ADDER','ADMIN')" th:href="@{/manage/ai}" class="nav-link nav-link--ai">✨ AI</a>
        <a th:href="@{/dashboard}" class="btn btn-ghost" th:if="${currentUser != null}" th:text="${currentUser.firstName}">Profile</a>
        <form th:action="@{/auth/logout}" method="post" style="display:inline;">
          <button type="submit" class="btn btn-ghost btn-sm">Logout</button>
        </form>
      </div>
    </div>
  </div>
</nav>

<!-- ── Flash messages fragment ── -->
<div th:fragment="flash" class="flash-container">
  <div th:if="${success}" class="flash flash--success">
    <span>✅</span> <span th:text="${success}"></span>
  </div>
  <div th:if="${error}" class="flash flash--error">
    <span>❌</span> <span th:text="${error}"></span>
  </div>
  <div th:if="${successMessage}" class="flash flash--success">
    <span>✅</span> <span th:text="${successMessage}"></span>
  </div>
  <div th:if="${errorMessage}" class="flash flash--error">
    <span>❌</span> <span th:text="${errorMessage}"></span>
  </div>
</div>

<!-- ── Footer ── -->
<footer th:fragment="footer" class="footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <span class="logo-icon">⚡</span>
      <span>EventFlow</span>
    </div>
    <p class="footer-text">AI-powered event management platform</p>
    <p class="footer-copy">© 2024 EventFlow. Built with Spring Boot + Claude AI.</p>
  </div>
</footer>

</body>
</html>
