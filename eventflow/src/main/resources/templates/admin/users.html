<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('User Management')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Admin Panel</div>
      <nav class="sidebar-nav">
        <a th:href="@{/admin/dashboard}" class="sidebar-link"><span class="sidebar-icon">📊</span> Dashboard</a>
        <a th:href="@{/admin/users}" class="sidebar-link active"><span class="sidebar-icon">👥</span> Users</a>
        <a th:href="@{/admin/data-adders/new}" class="sidebar-link"><span class="sidebar-icon">➕</span> New Data Adder</a>
        <a th:href="@{/admin/events}" class="sidebar-link"><span class="sidebar-icon">🗓️</span> All Events</a>
      </nav>
    </div>
  </aside>

  <main class="main-content">
    <div class="flex-between mb-24 flex-wrap gap-16">
      <div>
        <h1>User Management</h1>
        <p class="text-muted mt-8">Manage all registered users and data adders</p>
      </div>
      <div class="flex gap-8 flex-wrap">
        <form method="get" th:action="@{/admin/users}" class="flex gap-8">
          <input class="form-control" name="q" type="search" placeholder="Search users…"
                 th:value="${searchQuery}" style="width:220px"/>
          <button type="submit" class="btn btn-secondary">Search</button>
        </form>
        <a th:href="@{/admin/data-adders/new}" class="btn btn-primary">+ Add Data Adder</a>
      </div>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th>Joined</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="user : ${users.content}">
              <td>
                <div style="font-weight:600" th:text="${user.fullName}">Name</div>
              </td>
              <td class="text-muted" style="font-size:.85rem" th:text="${user.email}">email</td>
              <td>
                <span class="badge"
                      th:text="${user.role.name()}"
                      th:classappend="${user.role.name() == 'ADMIN'} ? 'badge-accent' :
                                       (${user.role.name() == 'DATA_ADDER'} ? 'badge-violet' : 'badge-muted')">
                  ROLE
                </span>
              </td>
              <td>
                <span class="badge" th:text="${user.active ? 'Active' : 'Disabled'}"
                      th:classappend="${user.active} ? 'badge-success' : 'badge-danger'">Active</span>
              </td>
              <td class="text-muted" style="font-size:.83rem"
                  th:text="${user.createdAt != null ? #temporals.format(user.createdAt,'dd MMM yyyy') : '—'}">date</td>
              <td>
                <div class="flex gap-8 flex-wrap" th:unless="${user.role.name() == 'ADMIN'}">
                  <!-- Promote/Demote -->
                  <form th:if="${user.role.name() == 'USER'}"
                        th:action="@{/admin/users/{id}/promote(id=${user.id})}" method="post">
                    <button type="submit" class="btn btn-secondary btn-sm"
                            onclick="return confirm('Promote to Data Adder?')">↑ Promote</button>
                  </form>
                  <form th:if="${user.role.name() == 'DATA_ADDER'}"
                        th:action="@{/admin/users/{id}/demote(id=${user.id})}" method="post">
                    <button type="submit" class="btn btn-ghost btn-sm"
                            onclick="return confirm('Demote to regular user?')">↓ Demote</button>
                  </form>
                  <!-- Toggle active -->
                  <form th:action="@{/admin/users/{id}/toggle-active(id=${user.id})}" method="post">
                    <button type="submit" class="btn btn-ghost btn-sm"
                            th:text="${user.active ? 'Disable' : 'Enable'}">Toggle</button>
                  </form>
                  <!-- Delete -->
                  <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post">
                    <button type="submit" class="btn btn-danger btn-sm"
                            onclick="return confirm('Delete this user? This cannot be undone.')">Delete</button>
                  </form>
                </div>
                <span th:if="${user.role.name() == 'ADMIN'}" class="text-muted" style="font-size:.82rem">—</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Pagination -->
    <div class="pagination" th:if="${users.totalPages > 1}">
      <a th:if="${users.hasPrevious()}"
         th:href="@{/admin/users(page=${currentPage - 1}, q=${searchQuery})}"
         class="page-btn">← Prev</a>
      <th:block th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}">
        <a th:href="@{/admin/users(page=${i}, q=${searchQuery})}"
           class="page-btn" th:classappend="${i == currentPage} ? 'active' : ''"
           th:text="${i + 1}">1</a>
      </th:block>
      <a th:if="${users.hasNext()}"
         th:href="@{/admin/users(page=${currentPage + 1}, q=${searchQuery})}"
         class="page-btn">Next →</a>
    </div>
  </main>
</div>

<script>setTimeout(() => document.querySelectorAll('.flash').forEach(f => f.style.opacity='0'), 4000);</script>
</body>
</html>
