<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('All Events — Admin')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Admin Panel</div>
      <nav class="sidebar-nav">
        <a th:href="@{/admin/dashboard}" class="sidebar-link"><span class="sidebar-icon">📊</span> Dashboard</a>
        <a th:href="@{/admin/users}" class="sidebar-link"><span class="sidebar-icon">👥</span> Users</a>
        <a th:href="@{/admin/data-adders/new}" class="sidebar-link"><span class="sidebar-icon">➕</span> New Data Adder</a>
        <a th:href="@{/admin/events}" class="sidebar-link active"><span class="sidebar-icon">🗓️</span> All Events</a>
      </nav>
    </div>
  </aside>

  <main class="main-content">
    <h1 class="mb-8">All Events</h1>
    <p class="text-muted mb-28">View and moderate all events on the platform</p>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Event</th>
              <th>Category</th>
              <th>Date</th>
              <th>Organizer</th>
              <th>Fill</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="event : ${events.content}">
              <td>
                <a th:href="@{/events/{id}(id=${event.id})}"
                   style="color:var(--text);font-weight:600"
                   th:text="${event.title}">Title</a>
              </td>
              <td>
                <span class="event-tag" th:text="${event.category.emoji + ' ' + event.category.displayName}">cat</span>
              </td>
              <td class="text-muted" style="font-size:.83rem"
                  th:text="${#temporals.format(event.eventDate,'dd MMM yyyy')}">date</td>
              <td class="text-muted" style="font-size:.83rem"
                  th:text="${event.createdBy?.fullName}">organizer</td>
              <td>
                <div style="font-size:.83rem;margin-bottom:4px"
                     th:text="${event.registeredCount + '/' + event.maxParticipants}">0/0</div>
                <div class="progress" style="width:80px">
                  <div class="progress-bar"
                       th:style="'width:' + (${event.registeredCount * 100 / event.maxParticipants}) + '%'"></div>
                </div>
              </td>
              <td>
                <span class="badge"
                      th:text="${event.status.name()}"
                      th:classappend="${event.status.name() == 'ACTIVE'} ? 'badge-success' :
                                       (${event.status.name() == 'CANCELLED'} ? 'badge-danger' : 'badge-muted')">
                  status
                </span>
              </td>
              <td>
                <div class="flex gap-8">
                  <form th:if="${event.status.name() == 'ACTIVE'}"
                        th:action="@{/admin/events/{id}/cancel(id=${event.id})}" method="post">
                    <button type="submit" class="btn btn-ghost btn-sm"
                            onclick="return confirm('Cancel this event?')">Cancel</button>
                  </form>
                  <form th:action="@{/admin/events/{id}/delete(id=${event.id})}" method="post">
                    <button type="submit" class="btn btn-danger btn-sm"
                            onclick="return confirm('Permanently delete this event?')">Delete</button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="pagination" th:if="${events.totalPages > 1}">
      <a th:if="${events.hasPrevious()}"
         th:href="@{/admin/events(page=${currentPage - 1})}"
         class="page-btn">← Prev</a>
      <th:block th:each="i : ${#numbers.sequence(0, events.totalPages - 1)}">
        <a th:href="@{/admin/events(page=${i})}"
           class="page-btn" th:classappend="${i == currentPage} ? 'active' : ''"
           th:text="${i + 1}">1</a>
      </th:block>
      <a th:if="${events.hasNext()}"
         th:href="@{/admin/events(page=${currentPage + 1})}"
         class="page-btn">Next →</a>
    </div>
  </main>
</div>
<script>setTimeout(() => document.querySelectorAll('.flash').forEach(f => f.style.opacity='0'), 4000);</script>
</body>
</html>
