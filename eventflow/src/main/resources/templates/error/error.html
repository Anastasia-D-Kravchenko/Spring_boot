<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="flex-center" style="min-height:calc(100vh - 64px);padding:40px">
  <div class="text-center" style="max-width:480px">
    <div style="font-size:5rem;margin-bottom:24px;font-family:var(--font-display);font-weight:800;color:var(--accent)"
         th:text="${errorCode ?: '500'}">500</div>
    <h1 class="mb-16">Something went wrong</h1>
    <p class="text-muted mb-32" th:text="${errorMessage ?: 'An unexpected error occurred. Please try again.'}">Error</p>
    <div class="flex gap-12 flex-center flex-wrap">
      <a href="/" class="btn btn-primary">Go Home</a>
      <a th:href="@{/events}" class="btn btn-secondary">Browse Events</a>
    </div>
  </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
