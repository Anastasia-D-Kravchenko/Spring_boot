# ─────────────────────────────────────────────────────────────
#  EventFlow — Production Profile
#  Activate with: --spring.profiles.active=prod
#  Set these environment variables in your deployment:
#    DB_URL, DB_USER, DB_PASS, ANTHROPIC_API_KEY
# ─────────────────────────────────────────────────────────────
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventflow}
    username: ${DB_USER:eventflow}
    password: ${DB_PASS:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  h2:
    console:
      enabled: false

  thymeleaf:
    cache: true

logging:
  level:
    com.eventflow: INFO
